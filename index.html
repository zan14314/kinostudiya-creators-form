function removeItem(which,i){const removed=draft[which][i];if(which==='portfolioFiles'&&removed?.local)portfolioLocalDelete(removed.id).catch(()=>{});draft[which].splice(i,1);if(which==='otherRoles'&&!draft.otherRoles.length&&draft.roles.includes('Другое'))draft.otherRoles.push('');save();render()}
function otherChanged(i,value){let old=draft.otherRoles[i]?.trim();draft.otherRoles[i]=value;let next=value.trim();if(old&&old!==next){if(draft.details[old]&&!draft.details[next])draft.details[next]=draft.details[old];if(old!==next)delete draft.details[old];for(const p of draft.projects){if(Array.isArray(p.directions))p.directions=p.directions.map(x=>x===old?next:x)}}save()}
function setDirection(i,j,checked,el){let p=draft.projects[i],r=activeRoles()[j];p.directions??=[];if(checked&&!p.directions.includes(r))p.directions.push(r);if(!checked)p.directions=p.directions.filter(x=>x!==r);save();el.closest('details').querySelector('summary').textContent=p.directions.join(', ')||'Выберите одно или несколько направлений'}
function roleSummary(d){if(d.summary!==undefined&&d.summary!==null)return String(d.summary);return [['Опыт',d.years?String(d.years)+' лет':''],['Задачи',d.skills],['Инструменты',d.tools],['Форматы',d.formats],['Руководство',d.supervision]].filter(([,v])=>v).map(([k,v])=>k+': '+v).join('\n')}
function projectNarrative(p){return [p.contribution||'',p.proof?'Процесс и подтверждение: '+p.proof:''].filter(Boolean).join('\n\n')}
function setProjectNarrative(i,value){const item=draft.projects[i];if(!item)return;item.contribution=value;delete item.proof;save()}
function setRoleDetail(i,key,value){let r=activeRoles()[i];if(r)detail(r,key,value)}
function contactSummary(p){return (p.contacts||[]).filter(x=>x.value?.trim()).map(x=>`${x.type}: ${x.value}`).join(' · ')||p.contact||''}
function safeLink(url){return /^https?:\/\//i.test(url||'')?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`:esc(url||'')}
function timeZoneOptions(){const examples={'UTC-12':'остров Бейкер','UTC-11':'Паго-Паго','UTC-10':'Гонолулу','UTC-9':'острова Гамбье','UTC-8':'остров Питкэрн','UTC-7':'Финикс','UTC-6':'Гватемала','UTC-5':'Богота','UTC-4':'Каракас','UTC-3':'Буэнос-Айрес','UTC-2':'Фернанду-ди-Норонья','UTC-1':'Кабо-Верде','UTC+0':'Рейкьявик','UTC+1':'Лагос','UTC+2':'Калининград','UTC+3':'Москва, Санкт-Петербург','UTC+4':'Самара, Дубай','UTC+5':'Екатеринбург','UTC+6':'Омск, Бишкек','UTC+7':'Новосибирск, Красноярск','UTC+8':'Иркутск, Пекин','UTC+9':'Якутск, Токио','UTC+10':'Владивосток','UTC+11':'Магадан','UTC+12':'Камчатка','UTC+13':'Апиа','UTC+14':'Киритимати'};let zones=[...Array.from({length:15},(_,i)=>'UTC+'+i),...Array.from({length:12},(_,i)=>'UTC-'+(i+1))];let legacy=draft.timezone&&!zones.includes(draft.timezone)&&draft.timezone!=='Другое'?`<option value="${esc(draft.timezone)}" selected>${esc((draft.timezone==='Другое'?draft.timezoneOther||'Другое':draft.timezone).replaceAll('_',' '))} — ранее выбранный пояс</option>`:'';return legacy+zones.map(zone=>`<option value="${zone}" ${draft.timezone===zone?'selected':''}>${zone}${examples[zone]?' — '+examples[zone]:''}</option>`).join('')+`<option value="Другое" ${draft.timezone==='Другое'?'selected':''}>Другое смещение</option>`}
function timezoneChanged(value){set('timezone',value);render()}
function portfolioDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('km-demo-portfolio',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function portfolioLocalPut(id,file){const db=await portfolioDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error||new Error('local storage failed'))}})}
async function portfolioLocalRead(id){const db=await portfolioDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly'),req=tx.objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onabort=()=>db.close()})}
async function portfolioLocalDelete(id){const db=await portfolioDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').delete(id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)};tx.onabort=()=>{db.close();reject(tx.error||new Error('local storage failed'))}})}
async function uploadPendingPortfolio(){for(const f of draft.portfolioFiles){if(!f.local)continue;const file=await portfolioLocalRead(f.id);if(!file)throw new Error('missing_local_file');const localId=f.id;await portfolioWrite(localId,file);f.id=uploadIds.get(localId);delete f.local;save();portfolioLocalDelete(localId).catch(()=>{})}}

const SCORE_WEIGHTS={quality:25,expertise:20,cinematic:15,control:20,evidence:10,leadership:10};
const CORE_SCORE_KEYS=['quality','expertise','cinematic','control','evidence'];
function metricNumber(value){if(value===undefined||value===null||value===''||value==='na')return null;let n=Number(value);return Number.isInteger(n)&&n>=1&&n<=10?n:null}
function calculateRoleTotal(person,role){const scores=person.reviews?.[role]?.scores||{};let weighted=0,weightSum=0,coreCount=0,leadership=false;for(const [key,weight] of Object.entries(SCORE_WEIGHTS)){const n=metricNumber(scores[key]?.value);if(n===null)continue;weighted+=n*weight;weightSum+=weight;if(key==='leadership')leadership=true;else coreCount++}return{value:weightSum?Math.round(weighted/weightSum*10):null,coreCount,leadership,preliminary:coreCount<CORE_SCORE_KEYS.length}}

function studioFetch(url,options={}){return fetch(url,{...options,headers:{...(options.headers||{}),Authorization:'Basic '+studioAuth}})}
function showStudioLogin(message=''){document.getElementById('workspace-label').textContent='ПАНЕЛЬ СТУДИИ';app.innerHTML=`<div class="studio-login"><span class="eyebrow">КИНОСТУДИЯ МОСКВА</span><h1>Вход в панель</h1><form onsubmit="studioLogin(event)"><div class="field"><label for="studio-user">Логин</label><input id="studio-user" autocomplete="username" required></div><div class="field"><label for="studio-password">Пароль</label><input id="studio-password" type="password" autocomplete="current-password" required></div><p class="login-error" role="alert">${esc(message)}</p><button class="btn lime" type="submit">Войти</button></form></div>`}
async function studioLogin(event){event.preventDefault();let btn=event.submitter;btn.disabled=true;try{let user=document.getElementById('studio-user').value.trim(),pass=document.getElementById('studio-password').value;studioAuth=btoa(user+':'+pass);let response=await studioFetch(API+'/profiles',{cache:'no-store'});if(!response.ok){studioAuth='';showStudioLogin('Неверный логин или пароль');return}sessionStorage.setItem('km-studio-auth',studioAuth);await bootShared()}catch(e){studioAuth='';showStudioLogin('Не удалось подключиться. Попробуйте ещё раз.')}finally{btn.disabled=false}}
function studioLogout(){sessionStorage.removeItem('km-studio-auth');studioAuth='';data=[];selected=null;showStudioLogin()}
async function bootShared(){if(page!=='db'){data=[];serverReady=true;render();return}if(!studioAuth){showStudioLogin();return}app.innerHTML='<p class="hint">Загружаем данные…</p>';try{let response=await studioFetch(API+'/profiles',{cache:'no-store'});if(response.status===401){studioLogout();return}if(!response.ok)throw new Error('load failed');data=await response.json();if(!Array.isArray(data))throw new Error('invalid data');for(const p of data)lastSynced.set(p.id,structuredClone(p));serverReady=true;selected=routeCreatorId();render()}catch(err){app.innerHTML='<div class="empty">Не удалось подключиться к базе. Проверьте соединение и обновите страницу.</div>'}}
bootShared();

</script></body></html>
